name: Automatisation des tests DevSecOps
on: push

jobs:
  Dependances:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
      
      - name: Scan des dépendances avec Trivy (affichage)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
      
      - name: Scan des dépendances avec Trivy (SARIF)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results. sarif'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true
      
      - name: Vérifier si le fichier SARIF existe
        id: check_sarif
        run: |
          if [ -f trivy-results.sarif ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "✅ Fichier SARIF généré"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "ℹ️ Aucun fichier SARIF généré (probablement aucune vulnérabilité)"
          fi
      
      - name: Upload des résultats Trivy
        if: steps.check_sarif. outputs.exists == 'true'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'

  Dockerfile:
    runs-on: ubuntu-latest
    needs: Dependances
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
      
      - name: Vérifier l'existence du Dockerfile
        id: check_dockerfile
        run: |
          if [ !  -f Dockerfile ]; then
            echo "⚠️ Dockerfile n'existe pas encore.  Ce job sera skippé."
            echo "exists=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "exists=true" >> $GITHUB_OUTPUT
          echo "✅ Dockerfile trouvé"
      
      - name: Scan du Dockerfile avec Trivy
        if: steps.check_dockerfile.outputs.exists == 'true'
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: 'Dockerfile'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH,MEDIUM'
      
      - name: Build de l'image Docker
        if: steps.check_dockerfile.outputs.exists == 'true'
        run: docker build -t breakableflask:${{ github. sha }} . 
      
      - name: Scan de l'image Docker avec Trivy
        if: steps. check_dockerfile.outputs.exists == 'true'
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          image-ref: 'breakableflask:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

  Deploy:
    runs-on: ubuntu-latest
    needs: Dockerfile
    steps:
      - name: Deploy
        run: |
          echo "✅ Pipeline terminé avec succès!"
          echo "Votre application est prête à être déployée"
