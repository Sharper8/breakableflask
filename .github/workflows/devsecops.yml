name: Automatisation des tests DevSecOps
on: push

jobs:
  Dependances:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
      
      - name: Scan des dépendances avec Trivy (affichage)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
      
      - name: Scan des dépendances avec Trivy (SARIF)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results. sarif'
          severity: 'CRITICAL,HIGH'
      
      - name: Upload des résultats Trivy
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  Dockerfile:
    runs-on: ubuntu-latest
    needs: Dependances
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
      
      - name: Vérifier l'existence du Dockerfile
        run: |
          if [ ! -f Dockerfile ]; then
            echo "❌ Dockerfile n'existe pas.  Veuillez le créer."
            exit 1
          fi
          echo "✅ Dockerfile trouvé"
      
      - name: Scan du Dockerfile avec Trivy (affichage)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: 'Dockerfile'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH,MEDIUM'
      
      - name: Build de l'image Docker
        run: docker build -t breakableflask:${{ github. sha }} .
      
      - name: Scan de l'image Docker avec Trivy (affichage)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          image-ref: 'breakableflask:${{ github. sha }}'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
      
      - name: Scan de l'image Docker avec Trivy (bloquant)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          image-ref: 'breakableflask:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-image-results.sarif'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
      
      - name: Upload des résultats de l'image
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-image-results.sarif'

  Deploy:
    runs-on: ubuntu-latest
    needs: Dockerfile
    steps:
      - name: Deploy
        run: |
          echo "✅ Tous les scans de sécurité sont passés!"
          echo "Votre application est prête à être déployée"
