name: Automatisation des tests DevSecOps
on: push

jobs:
  Dependances:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
      
      - name: 📋 Vérifier la présence de requirements.txt
        run: |
          echo "=== Contenu du repository ==="
          ls -la
          echo ""
          if [ -f requirements.txt ]; then
            echo "✅ requirements.txt trouvé"
            echo "=== Contenu de requirements.txt ==="
            cat requirements.txt
          else
            echo "❌ requirements.txt non trouvé"
          fi
      
      - name: 🔍 SCAN 1 - Vulnérabilités dans requirements.txt
        run: |
          echo "================================================"
          echo "🔍 SCAN DES DÉPENDANCES PYTHON (requirements.txt)"
          echo "================================================"
          docker run --rm -v $(pwd):/scan aquasec/trivy fs /scan \
            --severity CRITICAL,HIGH,MEDIUM,LOW \
            --scanners vuln \
            --format table
          echo ""
          echo "✅ Scan des dépendances terminé"
      
      - name: 📄 Générer le rapport JSON des dépendances
        run: |
          mkdir -p reports
          docker run --rm -v $(pwd):/scan aquasec/trivy fs /scan \
            --severity CRITICAL,HIGH,MEDIUM,LOW \
            --scanners vuln \
            --format json \
            --output /scan/reports/dependances-scan.json
          echo "✅ Rapport JSON généré: reports/dependances-scan.json"
      
      - name: 📤 Upload du rapport des dépendances
        uses: actions/upload-artifact@v4
        with:
          name: rapport-dependances
          path: reports/dependances-scan.json
          retention-days: 30
      
      - name: 📦 Créer un résumé initial des rapports
        run: |
          mkdir -p reports
          jq -n \
            --arg date "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
            --arg repo "${{ github.repository }}" \
            --arg commit "${{ github.sha }}" \
            --arg branch "${{ github.ref_name }}" \
            '{
              metadata: {
                date: $date,
                repository: $repo,
                commit: $commit,
                branch: $branch
              },
              scans: {
                dependances: "dependances-scan.json"
              }
            }' > reports/resume-scan-dependances.json
          echo "✅ Résumé initial créé: reports/resume-scan-dependances.json"
        continue-on-error: true
      
      - name: 📤 Upload du résumé des dépendances
        uses: actions/upload-artifact@v4
        with:
          name: rapport-resume-dependances
          path: reports/resume-scan-dependances.json
          retention-days: 30

  Dockerfile:
    runs-on: ubuntu-latest
    needs: Dependances
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
      
      - name: 📋 Vérifier la présence du Dockerfile
        id: check_dockerfile
        run: |
          if [ -f Dockerfile ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "✅ Dockerfile trouvé"
            echo ""
            echo "=== Contenu du Dockerfile ==="
            cat Dockerfile
            echo ""
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "❌ Dockerfile non trouvé - jobs Docker skippés"
          fi
      
      - name: 🔍 SCAN 2 - Mauvaises pratiques dans le Dockerfile
        if: steps.check_dockerfile.outputs.exists == 'true'
        run: |
          echo "================================================"
          echo "🔍 SCAN DE CONFIGURATION DU DOCKERFILE"
          echo "================================================"
          docker run --rm -v $(pwd):/scan aquasec/trivy config /scan/Dockerfile \
            --severity CRITICAL,HIGH,MEDIUM,LOW \
            --format table
          echo ""
          echo "✅ Scan de configuration terminé"
        continue-on-error: true
      
      - name: 📄 Générer le rapport JSON du Dockerfile
        if: steps.check_dockerfile.outputs.exists == 'true'
        run: |
          mkdir -p reports
          docker run --rm -v $(pwd):/scan aquasec/trivy config /scan/Dockerfile \
            --severity CRITICAL,HIGH,MEDIUM,LOW \
            --format json \
            --output /scan/reports/dockerfile-config-scan.json || echo "{}" > reports/dockerfile-config-scan.json
          echo "✅ Rapport JSON généré: reports/dockerfile-config-scan.json"
        continue-on-error: true
      
      - name: 📤 Upload du rapport Dockerfile
        if: steps.check_dockerfile.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rapport-dockerfile-config
          path: reports/dockerfile-config-scan.json
          retention-days: 30
      
      - name: 🔨 BUILD de l'image Docker
        if: steps.check_dockerfile.outputs.exists == 'true'
        run: |
          echo "================================================"
          echo "🔨 CONSTRUCTION DE L'IMAGE DOCKER"
          echo "================================================"
          docker build -t breakableflask:${{ github.sha }} .
          echo ""
          echo "✅ Image construite: breakableflask:${{ github.sha }}"
          echo ""
          echo "=== Informations sur l'image ==="
          docker images breakableflask:${{ github.sha }}
      
      - name: 🔍 SCAN 3 - Vulnérabilités dans l'image Docker construite
        if: steps.check_dockerfile.outputs.exists == 'true'
        run: |
          echo "================================================"
          echo "🔍 SCAN DE VULNÉRABILITÉS DE L'IMAGE DOCKER"
          echo "================================================"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy image breakableflask:${{ github.sha }} \
            --severity CRITICAL,HIGH,MEDIUM,LOW \
            --format table \
            --ignore-unfixed=false
          echo ""
          echo "✅ Scan de l'image terminé"
        continue-on-error: true
      
      - name: 📄 Générer le rapport JSON de l'image Docker
        if: steps.check_dockerfile.outputs.exists == 'true'
        run: |
          mkdir -p reports
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v $(pwd):/scan \
            aquasec/trivy image breakableflask:${{ github.sha }} \
            --severity CRITICAL,HIGH,MEDIUM,LOW \
            --format json \
            --output /scan/reports/docker-image-scan.json \
            --ignore-unfixed=false || echo "{}" > reports/docker-image-scan.json
          echo "✅ Rapport JSON généré: reports/docker-image-scan.json"
        continue-on-error: true
      
      - name: 📤 Upload du rapport de l'image Docker
        if: steps.check_dockerfile.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rapport-docker-image
          path: reports/docker-image-scan.json
          retention-days: 30
      
      - name: 📊 RÉSUMÉ FINAL
        if: steps.check_dockerfile.outputs.exists == 'true'
        run: |
          echo "================================================"
          echo "📊 RÉSUMÉ DES SCANS DE SÉCURITÉ"
          echo "================================================"
          echo ""
          echo "✅ SCAN 1: Dépendances Python (requirements.txt)"
          echo "   → Consultez le job 'Dependances' ci-dessus"
          echo ""
          echo "✅ SCAN 2: Configuration Dockerfile"
          echo "   → Mauvaises pratiques détectées affichées ci-dessus"
          echo ""
          echo "✅ SCAN 3: Image Docker construite"
          echo "   → Vulnérabilités OS + packages affichées ci-dessus"
          echo ""
          echo "================================================"
          echo "📥 Rapports téléchargeables disponibles:"
          echo "   → rapport-dependances"
          echo "   → rapport-dockerfile-config"
          echo "   → rapport-docker-image"
          echo "   → rapports-securite-complets"
          echo "================================================"
      
      - name: 📦 Créer un résumé des rapports
        if: steps.check_dockerfile.outputs.exists == 'true'
        run: |
          mkdir -p reports
          jq -n \
            --arg date "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
            --arg repo "${{ github.repository }}" \
            --arg commit "${{ github.sha }}" \
            --arg branch "${{ github.ref_name }}" \
            '{
              metadata: {
                date: $date,
                repository: $repo,
                commit: $commit,
                branch: $branch
              },
              scans: {
                dependances: "dependances-scan.json",
                dockerfile_config: "dockerfile-config-scan.json",
                docker_image: "docker-image-scan.json"
              }
            }' > reports/resume-scan.json
          echo "✅ Résumé créé: reports/resume-scan.json"
        continue-on-error: true
      
      - name: 📤 Upload de tous les rapports
        if: steps.check_dockerfile.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rapports-securite-complets
          path: reports/
          retention-days: 30

  Deploy:
    runs-on: ubuntu-latest
    needs: Dockerfile
    if: always()
    steps:
      - name: 🚀 Deploy
        run: |
          echo "✅ Pipeline de sécurité DevSecOps terminé!"
          echo ""
          echo "📋 Rapport complet disponible dans les jobs ci-dessus:"
          echo "  1. Job 'Dependances' → Vulnérabilités dans requirements.txt"
          echo "  2. Job 'Dockerfile' → Configuration + Image Docker"
          echo ""
          echo "📥 Rapports structurés téléchargeables (format JSON):"
          echo "  • rapport-dependances → Analyse des dépendances Python"
          echo "  • rapport-dockerfile-config → Configuration du Dockerfile"
          echo "  • rapport-docker-image → Vulnérabilités de l'image Docker"
          echo "  • rapports-securite-complets → Tous les rapports + résumé"
          echo ""
          echo "💡 Pour télécharger les rapports:"
          echo "   1. Allez dans l'onglet 'Actions' du repository"
          echo "   2. Sélectionnez ce workflow run"
          echo "   3. Téléchargez les artifacts dans la section 'Artifacts'"
          echo ""
          echo "🚀 Prêt pour le déploiement"
